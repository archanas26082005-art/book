
<!DOCTYPE html>
<html>
<head>
    <title>Book Information</title>

    <script src="jquery.min.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: lightblue;
        }

        h1 {
            color: darkblue;
        }

        button {
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
        }

        li {
            background-color: white;
            margin: 10px;
            padding: 10px;
            list-style: none;
        }
    </style>
</head>

<body>

    <h1>Book Information</h1>

    <button id="loadBooks">Load Books</button>

    <ul id="bookList"></ul>

    <script>
        $(document).ready(function() {

            $("#loadBooks").click(function() {

                $.ajax({
                    url: "books.json",
                    type: "GET",
                    dataType: "json",

                    success: function(data) {

                        $("#bookList").empty();

                        $.each(data.books, function(index, book) {

                            $("#bookList").append(
                                "<li><b>Title:</b> " +
                                book.title +
                                "<br><b>Author:</b> " +
                                book.author +
                                "</li>"
                            );

                        });
                    },

                    error: function() {
                        $("#bookList").html("Unable to load books");
                    }
                });

            });

        });
    </script>

</body>
</html>
